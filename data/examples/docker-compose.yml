version: "3.9"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://admin:Xq9#mP2$vLkR7nYz@prod-db.example.com:5432/appdb
      REDIS_URL: redis://:T4wB8cNjE6sK1pQm@cache.internal:6379
      JWT_SECRET: v3Ry$3cRetK3yTh4tSh0uldN0tB3H3r3
    depends_on:
      - db
      - cache

  db:
